[package]
name = "todarchy-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tod"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dirs.workspace = true
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
