[package]
name = "todarchy"
version = "0.1.0"
description = "Omarchy-native task manager"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "6"                     # inotify wrapper for theme file watching
dirs = "5"                       # XDG dirs
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
# sync
# v0.2 sync rides on a user-picked file-synced folder (iCloud, Dropbox,
# Syncthing). Automerge handles CRDT merges for concurrent edits on
# different devices. `age`/`argon2`/`reqwest` from the original
# relay-based design are gone — the folder-sync model doesn't need them.
automerge = "0.8"
# utility
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
