# Suggested Hyprland binds — append to ~/.config/hypr/bindings.conf
# (and the windowrules to ~/.config/hypr/windows.conf, or wherever you keep
# window rules).
#
# todokase is a terminal app: it runs inside your terminal and inherits your
# active Omarchy theme automatically. We launch it in a dedicated floating
# window so Super+T behaves like a quick "scratchpad" for tasks.

# Super+T — toggle todokase as a scratchpad (summon/dismiss like a dropdown,
# state preserved). `todokase-toggle` is installed alongside the binaries.
# IMPORTANT: Omarchy's default binds SUPER+T to "toggle floating/tiling"
# (tiling-v2.conf). Without this unbind, both fire on each press and the
# scratchpad flips between floating and tiled ("fullscreen") every other press.
unbind = SUPER, T
bind = SUPER, T, exec, todokase-toggle

# Super+Shift+T — one-shot quick-add via the CLI, no window to manage.
bind = SUPER SHIFT, T, exec, alacritty --class todokase-add -e bash -c 'read -p "task: " t && tod add "$t"'

# Float + center + size the todokase scratchpad window. NOTE: newer Hyprland
# (0.51+) uses `match:class`; older versions use `class:^(todokase)$` — use
# whichever your version accepts (validate with `hyprctl configerrors`).
windowrule = float on,        match:class todokase
windowrule = size 1200 760,   match:class todokase
windowrule = center on,       match:class todokase
# Glassier than Omarchy's 0.97 default (must come after it to win). Blur is
# already on globally, so the wallpaper reads through nicely. Tune to taste.
windowrule = opacity 0.85 0.78, match:class todokase
windowrule = float on,        match:class todokase-add
windowrule = size 480 90,     match:class todokase-add
windowrule = center on,       match:class todokase-add

# --- older Hyprland syntax (uncomment if the above errors) ---
# windowrule = float,  class:^(todokase)$
# windowrule = size 1200 760, class:^(todokase)$
# windowrule = center, class:^(todokase)$
