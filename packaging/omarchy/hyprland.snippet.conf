# Suggested Hyprland binds — append to ~/.config/hypr/bindings.conf
# (and the windowrules to ~/.config/hypr/windows.conf, or wherever you keep
# window rules).
#
# todarchy is a terminal app: it runs inside your terminal and inherits your
# active Omarchy theme automatically. We launch it in a dedicated floating
# window so Super+T behaves like a quick "scratchpad" for tasks.

# Super+T — toggle todarchy as a scratchpad (summon/dismiss like a dropdown,
# state preserved). `todarchy-toggle` is installed alongside the binaries.
bind = SUPER, T, exec, todarchy-toggle

# Super+Shift+T — one-shot quick-add via the CLI, no window to manage.
bind = SUPER SHIFT, T, exec, alacritty --class todarchy-add -e bash -c 'read -p "task: " t && tod add "$t"'

# Float + center + size the todarchy scratchpad window. NOTE: newer Hyprland
# (0.51+) uses `match:class`; older versions use `class:^(todarchy)$` — use
# whichever your version accepts (validate with `hyprctl configerrors`).
windowrule = float on,        match:class todarchy
windowrule = size 1200 760,   match:class todarchy
windowrule = center on,       match:class todarchy
# Glassier than Omarchy's 0.97 default (must come after it to win). Blur is
# already on globally, so the wallpaper reads through nicely. Tune to taste.
windowrule = opacity 0.85 0.78, match:class todarchy
windowrule = float on,        match:class todarchy-add
windowrule = size 480 90,     match:class todarchy-add
windowrule = center on,       match:class todarchy-add

# --- older Hyprland syntax (uncomment if the above errors) ---
# windowrule = float,  class:^(todarchy)$
# windowrule = size 1200 760, class:^(todarchy)$
# windowrule = center, class:^(todarchy)$
