# Suggested Hyprland binds — append to ~/.config/hypr/bindings.conf
#
# Super+T         open todarchy
# Super+Shift+T   quick-add dialog (todarchy-cli --popup)
# (waybar is expected to handle on-click itself)

bind = SUPER, T, exec, todarchy-gui
bind = SUPER SHIFT, T, exec, foot --app-id=todarchy-add -e bash -c 'read -p "task: " t && todarchy add "$t"'
